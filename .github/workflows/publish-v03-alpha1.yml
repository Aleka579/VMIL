name: Publish verified v0.3.0-alpha.1

on:
  push:
    branches: ['codex/release-v03-alpha1-20261022']
    paths:
      - '.github/workflows/publish-v03-alpha1.yml'
      - 'tools/release/Publish-VerifiedV03Alpha.ps1'
      - '.github/release-notes/v0.3.0-alpha.1.md'

permissions:
  contents: read

concurrency:
  group: publish-v0.3.0-alpha.1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Aleka579/VMIL' && github.ref == 'refs/heads/codex/release-v03-alpha1-20261022'
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify original CI artifact, upload assets, and publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/release/Publish-VerifiedV03Alpha.ps1
